name: AI PR review (ReadMind, history-aware)

# On every pull request, ReadMind reviews its own code the way it answers questions: it gives the LLM
# the diff plus the recent commit history of each changed file, asks for a cited review, verifies every
# [commit:...] citation with rag/citations.py and posts one sticky comment on the PR.
# Secrets: GEMINI_API_KEY (optional — without it an offline history report is posted instead).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the reviewer needs each file's past commits (HEAD = PR merge commit)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -r requirements-ci.txt google-genai

      - name: Review
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-2.5-flash' }}
          EMBED_MODEL: hash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python -m devops.ai_pr_review \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head HEAD \
            --repo-dir "$GITHUB_WORKSPACE" \
            --post
