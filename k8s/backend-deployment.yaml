apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmind-api
  namespace: readmind-prod
  labels:
    app: readmind-api
    tier: backend
    component: rag-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: readmind-api
  template:
    metadata:
      labels:
        app: readmind-api
        tier: backend
        component: rag-engine
    spec:
      containers:
        - name: api
          image: readmind-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: readmind-config
            - secretRef:
                name: readmind-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: hf-cache-volume
              mountPath: /root/.cache/huggingface
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: readmind-data-pvc
        - name: hf-cache-volume
          emptyDir: {}
