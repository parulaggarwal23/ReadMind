apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmind-frontend
  namespace: readmind-prod
  labels:
    app: readmind-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: readmind-frontend
  template:
    metadata:
      labels:
        app: readmind-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: readmind-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
