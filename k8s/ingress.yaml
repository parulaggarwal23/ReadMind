apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readmind-ingress
  namespace: readmind-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  rules:
    - host: readmind.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: readmind-api-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: readmind-frontend-svc
                port:
                  number: 80
